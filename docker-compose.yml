services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ledger_net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      provenance: false
    env_file:
      - .env.docker
    environment:
      SETUP_TYPE: cronjob
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ledger_net
    restart: "no"
  app:
    build:
      context: .
      dockerfile: Dockerfile
      provenance: false
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - ledger_net

  mockprovider:
    build:
      context: .
      dockerfile: Dockerfile.mockprovider
      provenance: false
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - ledger_net

networks:
  ledger_net:
    driver: bridge

volumes:
  postgres_data:
